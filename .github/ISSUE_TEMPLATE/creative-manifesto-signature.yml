name: "公开署名 / Sign the public roll"
description: "申请公开展示创作者昵称与 GitHub 用户名 / Apply to have your name and GitHub profile listed"
title: "[Signature] "
body:
  - type: markdown
    attributes:
      value: |
        **这个 Issue 对所有人可见。** 请不要填写真名、邮箱或联系方式。审核后网站仅展示昵称及 GitHub 资料链接。你可随时申请撤下。
        **This issue is public.** Do not post legal names, email addresses, or contact details. The website will show your nickname and GitHub profile after review. You can request removal at any time.
  - type: input
    id: display-name
    attributes:
      label: "创作者昵称 / Public nickname"
      description: "最多 48 个字符 / Up to 48 characters"
    validations:
      required: true
  - type: checkboxes
    id: agreement
    attributes:
      label: "公开署名确认 / Consent"
      options:
        - label: "我同意在网站上公开昵称与 GitHub 用户名 / I agree to have this nickname and my GitHub username listed on the site."
          required: true
